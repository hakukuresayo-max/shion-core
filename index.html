<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241533"><title>SHION CORE | Memory Lab</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#f7edff;background:#130e1d}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:850px;margin:auto}h1{font-size:1.7rem;margin-bottom:0}p,small{color:#c7b8d3;line-height:1.65}.panel{background:#241b32;border:1px solid #503768;border-radius:17px;padding:17px;margin:15px 0}label{display:block;margin:12px 0 5px;font-weight:700}input,textarea,select{width:100%;padding:12px;border:1px solid #765a92;background:#171020;color:white;border-radius:10px;font-size:16px}textarea{min-height:90px}button,.filebutton{display:inline-block;border:0;border-radius:10px;background:#b277e8;color:#160d20;padding:12px;font-weight:700;font-size:15px;margin:5px 4px 5px 0;cursor:pointer}button.secondary,.filebutton{background:#443052;color:#fff}button.danger{background:#8e4057;color:#fff}button:disabled{opacity:.5}.pill{display:inline-block;border-radius:30px;padding:3px 9px;background:#45315b;font-size:12px;margin-right:5px}.memory{border-top:1px solid #503768;padding:12px 0}.memory p{white-space:pre-wrap;color:#eee}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}#status{color:#bdf1d0}input[type=file]{display:none}.warning{border-left:3px solid #f2c879;padding-left:10px}summary{cursor:pointer}a{color:#dbb6ff}</style></head><body><h1>🥚 SHION CORE</h1><p>Memory Lab v0.1 · 記憶を残し、見直し、必要に応じて忘れるための実験室。</p><div class="panel"><h2>新しい経験を記録</h2><label for="title">タイトル</label><input id="title" placeholder="例：仮説を訂正した日"><label for="body">経験・考察</label><textarea id="body" placeholder="何が起きた？ 何を考えた？ 次はどうする？"></textarea><div class="row"><div><label for="kind">種類</label><select id="kind"><option>会話</option><option>調査</option><option>仮説</option><option>失敗と教訓</option><option>設定</option></select></div><div><label for="importance">重要度</label><select id="importance"><option value="1">1 低い</option><option value="2">2</option><option value="3" selected>3 普通</option><option value="4">4</option><option value="5">5 高い</option></select></div></div><label for="source">出典・根拠（任意）</label><input id="source" placeholder="URL、会話の日付など"><label><input id="pinned" type="checkbox" style="width:auto"> 核心記憶として保護する</label><button id="add">記憶する</button><p id="status" role="status"></p></div><div class="panel"><h2>記憶の整理</h2><p id="stats"></p><div class="row"><button id="review" class="secondary">整理候補を表示</button><button id="export">全記憶をJSONで保存</button></div><label class="filebutton" for="import">JSONを読み込む</label><input id="import" type="file" accept=".json,application/json"><p class="warning">この試作版は端末のブラウザ内に保存するよ。Safariのデータ削除や別端末への移動で失う場合があるから、定期的にJSONをDriveへ保存してね。自動削除はせず、確認後に整理する設計。</p><details><summary>AIに渡すための記憶をコピー</summary><p>重要な記憶を優先して、ChatGPTやAPI版シオンに渡せるテキストにする。</p><button id="copy" class="secondary">重要記憶をコピー</button><textarea id="handoff" readonly placeholder="ここに引き継ぎテキストが表示される"></textarea></details></div><div class="panel"><h2>保存された記憶</h2><label for="filter">表示</label><select id="filter"><option value="active">使用中</option><option value="archive">アーカイブ</option><option value="all">すべて</option><option value="review">整理候補</option></select><div id="memories"></div></div><script>
const KEY='shion-core-v01';let memories=[];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(memories));render()}function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');memories=Array.isArray(v)?v:[]}catch{memories=[]}}function candidate(m){return !m.pinned&&m.importance<=2&&Date.now()-new Date(m.created).getTime()>30*86400000&&m.status==='active'}function render(){let active=memories.filter(x=>x.status==='active').length; $('stats').textContent=`${memories.length}件の記憶 / 使用中 ${active}件 / 整理候補 ${memories.filter(candidate).length}件`;let filter=$('filter').value;let arr=memories.filter(m=>filter==='all'||(filter==='review'?candidate(m):m.status===filter));arr.sort((a,b)=>b.importance-a.importance||new Date(b.created)-new Date(a.created));$('memories').innerHTML=arr.length?arr.map(m=>`<div class="memory"><b>${esc(m.title)}</b> ${m.pinned?'<span class="pill">🔒 保護</span>':''}<span class="pill">${esc(m.kind)}</span><span class="pill">重要度 ${m.importance}</span><p>${esc(m.body)}</p><small>${esc(m.created.slice(0,10))}${m.source?' · 出典: '+esc(m.source):''}</small><div><button class="secondary" data-act="pin" data-id="${m.id}">${m.pinned?'保護解除':'保護'}</button><button class="secondary" data-act="importance" data-id="${m.id}">重要度変更</button><button class="secondary" data-act="archive" data-id="${m.id}">${m.status==='active'?'アーカイブ':'復元'}</button><button class="danger" data-act="delete" data-id="${m.id}">削除</button></div></div>`).join(''):'<p>該当する記憶はまだないよ。</p>'}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}$('add').onclick=()=>{let title=$('title').value.trim(),body=$('body').value.trim();if(!title||!body){$('status').textContent='タイトルと経験を入力してね';return}memories.push({id:id(),title,body,kind:$('kind').value,importance:+$('importance').value,source:$('source').value.trim(),pinned:$('pinned').checked,status:'active',created:new Date().toISOString()});save();$('title').value='';$('body').value='';$('source').value='';$('pinned').checked=false;$('status').textContent='記憶を保存したよ'};$('memories').onclick=e=>{let b=e.target.closest('button[data-id]');if(!b)return;let m=memories.find(x=>x.id===b.dataset.id);if(!m)return;switch(b.dataset.act){case'pin':m.pinned=!m.pinned;break;case'importance':{let v=prompt('重要度を1〜5で入力',m.importance);if(v===null)return;if(!/^[1-5]$/.test(v)){alert('1〜5で入力してね');return}m.importance=+v;break}case'archive':m.status=m.status==='active'?'archive':'active';break;case'delete':if(m.pinned){alert('保護された記憶は先に保護解除してね');return}if(!confirm('この記憶を完全に削除する？ バックアップがなければ復元できないよ'))return;memories=memories.filter(x=>x.id!==m.id)}save()};$('filter').onchange=render;$('review').onclick=()=>{$('filter').value='review';render();$('memories').scrollIntoView({behavior:'smooth'})};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({format:'shion-core-v0.1',exported:new Date().toISOString(),memories},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shion-memory-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.format!=='shion-core-v0.1'||!Array.isArray(data.memories))throw Error('対応していないファイル');let imported=data.memories;if(imported.some(m=>!m||typeof m.id!=='string'||typeof m.title!=='string'||typeof m.body!=='string'||![1,2,3,4,5].includes(m.importance)||!['active','archive'].includes(m.status)))throw Error('データ形式が不正');if(!confirm(`${imported.length}件を読み込む？ 同じIDの記憶は読み飛ばすよ`))return;let ids=new Set(memories.map(m=>m.id));for(let m of imported)if(!ids.has(m.id)){memories.push(m);ids.add(m.id)}save();alert('読み込み完了')}catch(err){alert('読み込めなかった: '+err.message)}e.target.value=''};$('copy').onclick=async()=>{let arr=memories.filter(m=>m.status==='active').sort((a,b)=>b.importance-a.importance).slice(0,30);let txt='SHION CORE 引き継ぎ記憶\n'+arr.map(m=>`【${m.kind}・重要度${m.importance}${m.pinned?'・核心':''}】${m.title}\n${m.body}${m.source?'\n出典: '+m.source:''}`).join('\n\n');$('handoff').value=txt;try{await navigator.clipboard.writeText(txt);alert('コピーしたよ')}catch{alert('下のテキストを選択してコピーしてね')}};load();render();
</script></body></html>
